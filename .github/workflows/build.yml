name: build
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Base IPA: direct URL or parts:owner/repo/tag/prefix (e.g. parts:mpoukiarmel21-beep/whamRaptor/base-449/base449.part)'
        required: false
        default: ''
  push:
    branches: [master, main]
    paths:
      - 'Tweak/**'
      - 'vendor/**'
      - 'Makefile'
      - 'control'
      - 'WhamRaptor.plist'
      - 'Entitlements/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          # sdks
          if [ ! -d "$THEOS/sdks/master" ]; then
            if [ -d "$THEOS/sdks" ] && ls "$THEOS/sdks"/*.sdk >/dev/null 2>&1; then
              echo "sdk exists"
            else
              mkdir -p "$THEOS/sdks"
              curl -fsSLo /tmp/master.tar.gz https://github.com/theos/sdks/archive/master.tar.gz
              tar -xzf /tmp/master.tar.gz -C "$THEOS/sdks" --strip-components=1
              rm /tmp/master.tar.gz
            fi
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          brew list --versions ldid >/dev/null 2>&1 || brew install ldid
          if ! command -v insert_dylib >/dev/null 2>&1; then
            git clone https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
            (cd /tmp/insert_dylib && xcodebuild -quiet 2>&1 | tail -n 20 || make 2>&1 | tail -n 20 || true)
            for c in /tmp/insert_dylib/build/Release/insert_dylib /tmp/insert_dylib/insert_dylib; do
              [ -f "$c" ] && sudo cp "$c" /usr/local/bin/insert_dylib || cp "$c" /usr/local/bin/insert_dylib 2>/dev/null || true
            done
            chmod +x /usr/local/bin/insert_dylib 2>/dev/null || true
          fi
          which ldid; which insert_dylib || true
          ls "$THEOS/sdks" | head -n 20

      - name: Build dylib
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean 2>&1 | tail -n 5
          make -j$(sysctl -n hw.ncpu) 2>&1 | tail -n 80
          echo "--- search dylib ---"
          find . -name "*.dylib" -type f 2>&1 | head -n 20
          ls -R .theos 2>&1 | head -n 80
          DYLIB=$(find .theos -name "WhamRaptor.dylib" -type f 2>/dev/null | head -n 1)
          [ -z "$DYLIB" ] && DYLIB=$(find .theos -name "*.dylib" -type f | head -n 1)
          [ -z "$DYLIB" ] && DYLIB=$(find . -name "*.dylib" -type f | head -n 1)
          if [ -z "$DYLIB" ]; then echo "::error::No dylib"; exit 1; fi
          echo "DYLIB=$DYLIB" | tee -a "$GITHUB_ENV"
          ls -lh "$DYLIB"
          otool -L "$DYLIB" 2>&1 | head -n 30 || true
          cp "$DYLIB" /tmp/WhamRaptor.dylib
          ls -lh /tmp/WhamRaptor.dylib
          # also try deb package (optional)
          make package 2>&1 | tail -n 30 || true
          ls -lh packages/ 2>&1 | head -n 20 || echo "no packages dir"

      - name: Download base IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_URL="${{ inputs.ipa_url }}"
          echo "ipa_url=$IPA_URL"
          rm -f Input.ipa
          if [ -z "$IPA_URL" ]; then
            echo "No ipa_url supplied — skipping IPA build, will try local base-449 parts if present"
            # try self-hosted base-449 parts (published by split upload)
            if gh release view base-449 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Found base-449 release, downloading parts"
              rm -rf _parts && mkdir -p _parts
              gh release download base-449 --repo "$GITHUB_REPOSITORY" --pattern "base449.part*" -D _parts 2>&1 | tail -n 20 || true
              if ls _parts/base449.part* >/dev/null 2>&1; then
                cat _parts/base449.part* > Input.ipa
                ls -lh Input.ipa
              fi
            fi
            if [ ! -f Input.ipa ]; then
              echo "No base IPA available — dylib only build"
              exit 0
            fi
          elif [[ "$IPA_URL" == parts:* ]]; then
            SPEC="${IPA_URL#parts:}"
            REPO="$(echo "$SPEC" | cut -d/ -f1-2)"
            TAG="$(echo "$SPEC" | cut -d/ -f3)"
            PREFIX="$(echo "$SPEC" | cut -d/ -f4)"
            echo "parts repo=$REPO tag=$TAG prefix=$PREFIX"
            rm -rf _parts && mkdir -p _parts
            gh release download "$TAG" --repo "$REPO" --pattern "${PREFIX}*" -D _parts 2>&1 | tail -n 20
            ls -lh _parts
            cat _parts/${PREFIX}* > Input.ipa 2>/dev/null || cat _parts/* > Input.ipa
            ls -lh Input.ipa
          elif [[ "$IPA_URL" == *github.com*releases*download* ]]; then
            REPO="$(echo "$IPA_URL" | sed -E 's|https?://github.com/||; s|/releases/download/.*||')"
            TAG="$(echo "$IPA_URL" | sed -E 's|.*/releases/download/||; s|/[^/]*$||')"
            ASSET="$(echo "$IPA_URL" | sed -E 's|.*/releases/download/[^/]+/||')"
            echo "gh release download repo=$REPO tag=$TAG asset=$ASSET"
            gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" -O Input.ipa 2>&1 | tail -n 20 || curl -L -o Input.ipa "$IPA_URL"
            ls -lh Input.ipa
          elif [[ "$IPA_URL" == http* ]]; then
            curl -L -o Input.ipa "$IPA_URL" --connect-timeout 30 --max-time 600 --retry 2
            ls -lh Input.ipa
          else
            # bare tag in current repo
            rm -rf _dl && mkdir -p _dl
            gh release download "$IPA_URL" --repo "$GITHUB_REPOSITORY" --pattern "*.ipa" -D _dl 2>&1 | tail -n 20 || true
            IPA_DL="$(find _dl -name "*.ipa" -type f | head -n 1 || true)"
            [ -n "$IPA_DL" ] && cp "$IPA_DL" Input.ipa
            ls -lh Input.ipa
          fi
          if [ -f Input.ipa ]; then
            file Input.ipa || true
            # quick check it's zip
            unzip -l Input.ipa 2>&1 | head -n 20 || true
          fi

      - name: Clean + Inject + Package IPA
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f Input.ipa ]; then echo "No Input.ipa — skipping inject"; exit 0; fi
          if [ ! -f /tmp/WhamRaptor.dylib ]; then echo "::error::No dylib"; exit 1; fi
          WORKDIR="$(mktemp -d)"
          echo "workdir=$WORKDIR"
          cp Input.ipa "$WORKDIR/Input.ipa"
          cd "$WORKDIR"
          unzip -q Input.ipa
          APP="$(ls -d Payload/*.app | head -n 1)"
          echo "APP=$APP"
          # Clean RyukGram leftovers if present
          rm -rf "$APP/RyukGram.bundle" 2>/dev/null || true
          rm -f "$APP/Frameworks/RyukGram.dylib" 2>/dev/null || true
          rm -f "$APP/Frameworks/FLEXing.dylib" 2>/dev/null || true
          rm -f "$APP/Frameworks/libflex.dylib" 2>/dev/null || true
          rm -rf "$APP/Frameworks/CydiaSubstrate.framework" 2>/dev/null || true
          # LIEF clean LC_LOAD_WEAK_DYLIB
          BIN="$APP/Instagram"
          if [ ! -f "$BIN" ]; then BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null || echo Instagram)"; fi
          echo "BIN=$BIN"
          if [ -f "$BIN" ]; then
            python3 -m pip install -q lief --break-system-packages 2>&1 | tail -n 5 || python3 -m pip install -q lief 2>&1 | tail -n 5 || pip3 install -q lief --break-system-packages 2>&1 | tail -n 5 || true
            python3 << 'PY'
          import lief, pathlib, os, sys
          bin_path=None
          for p in pathlib.Path("Payload").rglob("Instagram"):
              if p.is_file():
                  try:
                      b=lief.parse(str(p))
                      if b: bin_path=str(p); break
                  except: pass
          if not bin_path:
              import subprocess
              r=subprocess.run(["find","Payload","-type","f","-name","Instagram"], capture_output=True,text=True)
              print(r.stdout); sys.exit(0)
          print("bin",bin_path)
          binary=lief.parse(bin_path)
          libs=[str(c.path) for c in binary.libraries]
          print("libs before",len(libs))
          for l in libs: print(" ",l)
          to_remove=[l for l in libs if any(k in l for k in ["RyukGram","FLEX","libflex","CydiaSubstrate"])]
          print("to_remove",to_remove)
          for r in to_remove:
              try:
                  if hasattr(binary,'remove_library'): binary.remove_library(r)
                  print("removed",r)
              except Exception as e: print("remove failed",r,e)
          if to_remove:
              binary.write(bin_path); print("rewritten")
          b2=lief.parse(bin_path)
          libs2=[str(c.path) for c in b2.libraries]
          for l in libs2:
              if any(k in l for k in ["RyukGram","FLEX","Substrate"]):
                  print("STILL",l); sys.exit(1)
          print("clean OK")
          PY
          fi
          mkdir -p "$APP/Frameworks"
          cp /tmp/WhamRaptor.dylib "$APP/Frameworks/WhamRaptor.dylib"
          ls -lh "$APP/Frameworks/WhamRaptor.dylib"
          # insert_dylib as @rpath (matches existing LC_RPATH @executable_path/Frameworks)
          insert_dylib --all-yes --weak --inplace "@rpath/WhamRaptor.dylib" "$BIN" < /dev/null
          otool -l "$BIN" 2>&1 | grep -q "WhamRaptor.dylib" || { echo "::error::load command not found"; otool -L "$BIN" | head -n 40; exit 1; }
          echo "== injected =="; otool -L "$BIN" | head -n 40
          codesign --force --sign - "$APP/Frameworks/WhamRaptor.dylib" 2>&1 | head -n 10 || true
          codesign --force --sign - "$BIN" 2>&1 | head -n 10 || true
          codesign -dvv "$BIN" 2>&1 | head -n 15 || true
          rm -f "$GITHUB_WORKSPACE/WhamRaptor.ipa"
          zip -r -X -q "$GITHUB_WORKSPACE/WhamRaptor.ipa" Payload/ -x '*.DS_Store'
          ls -lh "$GITHUB_WORKSPACE/WhamRaptor.ipa"
          echo "FINAL_IPA=$GITHUB_WORKSPACE/WhamRaptor.ipa" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WhamRaptor-IPA
          path: |
            WhamRaptor.ipa
            packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}"
          REPO="${{ github.repository }}"
          gh release create "$TAG" --repo "$REPO" --title "WhamRaptor Build ${{ github.run_number }}" --notes "Auto build ${{ github.run_number }} — $(git log -1 --oneline)" 2>&1 | tail -n 10 || true
          if [ -f WhamRaptor.ipa ]; then gh release upload "$TAG" WhamRaptor.ipa --repo "$REPO" --clobber 2>&1 | tail -n 10; echo "IPA: https://github.com/$REPO/releases/download/$TAG/WhamRaptor.ipa"; fi
          if ls packages/*.deb >/dev/null 2>&1; then gh release upload "$TAG" packages/*.deb --repo "$REPO" --clobber 2>&1 | tail -n 10 || true; fi
